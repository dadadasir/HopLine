name: Bug report
description: Report a reproducible problem in HopLine.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [Security › Report a vulnerability](https://github.com/dadadasir/HopLine/security/advisories/new), not this public form.
        Please search existing issues before reporting a duplicate. English and Chinese are welcome.
  - type: input
    id: version
    attributes:
      label: HopLine version and build source
      description: Include the version, edition, and Actions run or source revision if available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local OS/version and CPU architecture; remote Linux distribution if relevant. Do not include real hostnames, addresses, or usernames.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give a minimal sequence using fictional host details.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error text and, for UI problems, screenshots with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic bundle
      description: |
        Export from Help › Export diagnostics (帮助 › 导出诊断包), review the preview, save the .txt file, and attach it here.
        The bundle is automatically redacted; please review it again before submitting. 诊断包已经自动脱敏，提交前请再检查一遍。
        If the app cannot start or export fails, explain that here instead. Do not attach secrets or real host details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed all text and attachments and removed credentials and sensitive host information.
          required: true
